services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    tmpfs:
      - /var/lib/postgresql/data   # ephemeral; no volume, wiped on teardown
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 3s
      timeout: 3s
      retries: 15

  tests:
    build: .
    environment:
      # Runtime URL (lifespan / alembic) and the conftest override that makes
      # the pytest suite itself run against Postgres — the cross-engine parity
      # proof. Without TEST_DATABASE_URL, conftest falls back to temp SQLite.
      DATABASE_URL: postgresql+psycopg://test:test@test-db:5432/test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@test-db:5432/test
    depends_on:
      test-db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "alembic upgrade head && python -m pytest tests/ -q"]
