[project]
name = "agent-evalkit"
version = "0.1.0"
description = "Portable capability x scenario agent-eval engine (goldens, ports, metrics, report/baseline)."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0,<3.0.0",
]

# The core (types, ports, registry, dataset store, deterministic metrics, report,
# baseline) runs on pydantic alone. The two judged/trajectory metric families are
# extras so a consuming project pays only for what it uses; `evalkit.metrics`
# degrades gracefully when an extra is absent.
[project.optional-dependencies]
trajectory = ["agentevals>=0.0.9,<0.1"]
judged = ["deepeval>=4.0,<5"]
all = ["agentevals>=0.0.9,<0.1", "deepeval>=4.0,<5"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "evalkit" = "." }
packages = ["evalkit"]
