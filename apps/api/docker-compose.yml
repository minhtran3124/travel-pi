services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Arq queue for research + memory extraction (REDIS_URL). Unset it to run both in-process.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Same image as api; consumes the queue (app/worker.py).
  worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://travel:travel@db:5432/travel
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
    volumes:
      - .:/app
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build: .
    env_file:
      - .env
    environment:
      # Override .env so the container reaches the db service, not localhost.
      DATABASE_URL: postgresql+psycopg://travel:travel@db:5432/travel
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    # Bind-mount source so host edits reach the container; --reload picks them up.
    volumes:
      - .:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
