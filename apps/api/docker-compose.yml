services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      # Override .env so the container reaches the db service, not localhost.
      DATABASE_URL: postgresql+psycopg://travel:travel@db:5432/travel
      ENVIRONMENT: development
      # Migrations are opt-in in the image; dev wants them on every start.
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    # Bind-mount source so host edits reach the container; --reload picks them up.
    volumes:
      - .:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
