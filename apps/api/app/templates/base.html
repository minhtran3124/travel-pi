<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %} · Travel Planner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════
       SUNSET — v2 dark theme (brightened surfaces)
       Dark warm surfaces + light text, coral accent identity.
       Elevation: lifted dark cards over a deep warm-neutral canvas.
       All surface/text pairings verified ≥ WCAG AA.
    ═══════════════════════════════════════════ */
    :root {
      --bg:       #1a1614;   /* app canvas (lifted dark, faint warm-neutral) */
      --panel:    #221d1a;   /* raised surfaces: cards, table, nav */
      --panel-2:  #2e2723;   /* inset tier: inputs, table head, tiles */
      --line:     #3e342e;   /* borders */
      --line-soft:#2f2823;   /* row dividers */
      /* accent — coral sunset */
      --accent:   #ff6f5e;   /* bright coral: focus, active, hairlines */
      --accent-2: #c2410c;   /* deep coral: solid fills under white text */
      --accent-dim: #ffa99c; /* light coral text-accent on dark */
      --accent-glow: rgba(255, 111, 94, 0.16);  /* hover / is-on wash */
      --on-accent: #3a0f08;  /* dark ink for text/glyphs on bright coral fills */
      /* text */
      --ink:      #efe9e6;   /* primary text (warm off-white) */
      --muted:    #a89c96;   /* secondary text (AA on all dark surfaces) */
      /* status — bright to read on dark */
      --yellow:   #fbbf24;   /* estimated */
      --green:    #34d399;   /* landed / direct / confirmed */
      --orange:   #fb923c;   /* delayed / stops */
      --cyan:     #38bdf8;   /* boarding */
      --red:      #f87171;   /* error / alert */
      --hotel:    #2563eb;   /* hotel booking accent (white-text safe) */
      --violet:   #c084fc;   /* tertiary accent (support-agent role coding) */
      --photo-bg: #2e2723;   /* image placeholder backdrop */
      /* shape */
      --radius:   12px;
      --radius-sm: 8px;
      --shadow:   0 2px 12px rgba(0,0,0,.45);
      --shadow-lg: 0 14px 32px -8px rgba(0,0,0,.60), 0 4px 10px -4px rgba(0,0,0,.40);
      --ring:     0 0 0 3px rgba(255,111,94,.35);
      --scrim:    rgba(6,7,10,.74);  /* modal backdrop overlay */
      /* z-index scale — semantic, no magic numbers */
      --z-sticky:   100;
      --z-progress: 200;
      --z-modal:    2000;
      /* scrollbar (tokenised so themes can override) */
      --scroll-thumb: #3a4644;
      --scroll-thumb-hover: #4a5755;
    }

    /* ── Alternate theme: Nightfall (cool teal) — toggled via data-theme ──
       Both Sunset and Nightfall are dark and share the bright status/topic
       palette, so the colour-coding stays AA in either. */
    html[data-theme="nightfall"] {
      --bg:       #141b1a;
      --panel:    #1b2424;
      --panel-2:  #243030;
      --line:     #33403e;
      --line-soft:#2a3534;
      --accent:   #2dd4bf;
      --accent-2: #0f766e;
      --accent-dim: #5eead4;
      --accent-glow: rgba(45, 212, 191, 0.16);
      --on-accent: #08201d;
      --ink:      #e7eceb;
      --muted:    #93a1a0;
      --photo-bg: #1a2224;
      --ring:     0 0 0 3px rgba(45,212,191,.30);
      --scroll-thumb: #2b3433;
      --scroll-thumb-hover: #3b4544;
    }
    html { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 999px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }

    /* ── Top nav bar ── */
    .topbar {
      display: flex; align-items: center; gap: 0;
      padding: 0 24px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      height: 52px;
    }
    .topbar-brand {
      display: flex; align-items: center; gap: 9px;
      font-size: 0.95rem; font-weight: 800; letter-spacing: -0.01em;
      color: var(--ink);
      text-decoration: none;
      padding-right: 28px;
      border-right: 1px solid var(--line);
      margin-right: 8px;
      white-space: nowrap;
    }
    .topbar-brand .icon {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px;
      background: var(--accent);
      color: var(--on-accent);
      border-radius: 7px;
      font-size: 0.88rem;
    }
    .tabs {
      display: flex; align-items: center; gap: 2px;
      flex: 1;
    }
    .tab {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 13px;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.875rem; font-weight: 600;
      border-radius: var(--radius-sm);
      transition: color .15s, background .15s;
      white-space: nowrap;
    }
    .tab:hover { color: var(--ink); background: var(--panel-2); }
    .tab.on { color: var(--ink); background: var(--panel-2); position: relative; }
    .tab.on::after {
      content: ''; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
      width: 20px; height: 2px; background: var(--accent); border-radius: 2px;
    }
    .tabs .spacer { flex: 1; }
    .tab-ext { color: var(--accent-dim); }
    .tab-ext:hover { color: var(--ink); background: transparent; }
    .tab-badge {
      margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 999px; background: var(--accent); color: var(--on-accent);
      font-size: 0.66rem; font-weight: 800; font-variant-numeric: tabular-nums;
    }

    /* ── Topbar buttons (theme switch + palette trigger) ── */
    .theme-btn {
      display: inline-flex; align-items: center; gap: 6px; margin-left: 6px;
      height: 30px; padding: 0 11px; border-radius: var(--radius-sm);
      background: var(--panel-2); border: 1px solid var(--line);
      color: var(--muted); font: 600 0.8rem inherit; cursor: pointer;
      white-space: nowrap; transition: color .15s, border-color .15s;
    }
    .theme-btn:hover { color: var(--ink); border-color: var(--accent); }
    .theme-btn:focus-visible { outline: none; box-shadow: var(--ring); }
    .theme-dot {
      width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    @media (max-width: 640px) { .theme-name { display: none; } }

    /* ── Command palette (⌘K) ── */
    .cmdk { position: fixed; inset: 0; z-index: var(--z-modal); display: none; }
    .cmdk.show { display: block; }
    .cmdk-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(2px); }
    .cmdk-panel {
      position: relative; z-index: 1; width: min(560px, 92vw); margin: 12vh auto 0;
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow-lg); overflow: hidden;
    }
    .cmdk-input {
      width: 100%; border: none; outline: none; background: transparent; color: var(--ink);
      font: 1.05rem inherit; padding: 16px 18px; border-bottom: 1px solid var(--line-soft);
    }
    .cmdk-input::placeholder { color: var(--muted); }
    .cmdk-list { max-height: 56vh; overflow-y: auto; padding: 6px; }
    .cmdk-empty { padding: 22px; text-align: center; color: var(--muted); font-size: .9rem; }
    .cmdk-group { padding: 9px 12px 4px; font-size: .62rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .cmdk-item {
      display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: var(--radius-sm);
      cursor: pointer; color: var(--ink); text-decoration: none;
    }
    .cmdk-item .ic { width: 22px; text-align: center; font-size: 1rem; flex: 0 0 auto; }
    .cmdk-item .lbl { flex: 1; font-size: .92rem; font-weight: 600; }
    .cmdk-item .sub { color: var(--muted); font-size: .8rem; font-weight: 400; margin-left: 6px; }
    .cmdk-item.active, .cmdk-item:hover { background: var(--accent-glow); }
    .cmdk-foot { display: flex; gap: 16px; padding: 8px 14px; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: .72rem; }
    .cmdk-foot kbd { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font: inherit; font-size: .68rem; }

    /* ── Themed prompt/confirm dialog (replaces native prompt/confirm) ── */
    .tp-dialog { position: fixed; inset: 0; z-index: var(--z-modal); display: none; align-items: center; justify-content: center; padding: 20px; }
    .tp-dialog.show { display: flex; }
    .tp-dialog-back { position: absolute; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(3px); }
    .tp-dialog-panel { position: relative; z-index: 1; width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 20px; animation: tp-pop .16s ease-out; }
    @keyframes tp-pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
    .tp-dialog-title { margin: 0 0 4px; font-size: 1.05rem; font-weight: 800; }
    .tp-dialog-msg { margin: 0 0 14px; color: var(--muted); font-size: .9rem; line-height: 1.5; }
    .tp-dialog-input { width: 100%; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; font: 1rem inherit; }
    .tp-dialog-input:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
    .tp-dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .tp-btn { border: none; border-radius: var(--radius-sm); padding: 9px 18px; font: 700 .9rem inherit; cursor: pointer; }
    .tp-btn-cancel { background: var(--panel-2); border: 1px solid var(--line); color: var(--ink); }
    .tp-btn-cancel:hover { border-color: var(--accent); }
    .tp-btn-ok { background: var(--accent); color: var(--on-accent); }
    .tp-btn-ok:hover { filter: brightness(1.08); }
    .tp-btn-ok.danger { background: var(--red); color: #2a0a0a; }
    @media (prefers-reduced-motion: reduce) { .tp-dialog-panel { animation: none; } }

    .wrap { max-width: 1140px; margin: 0 auto; padding: 28px 20px 64px; }
    /* Opt-in wide layout (e.g. prompt dashboard) — roomier for side-by-side views. */
    .wrap.wrap-wide { max-width: 1800px; padding-left: clamp(20px, 3vw, 40px); padding-right: clamp(20px, 3vw, 40px); }

    /* ── Page header (section title strip) ── */
    .page-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 16px;
    }
    .page-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em;
    }
    .page-title .icon { font-size: 1.25rem; }
    .page-meta { font-size: 0.88rem; font-weight: 600; color: var(--muted); }

    /* ── Board head (coloured strip for FIDS pages) ── */
    .board-head {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-bottom: none;
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 14px 20px;
    }
    .board-title {
      display: flex; align-items: center; gap: 10px;
      margin: 0;                        /* reset <h1> default margin */
      font-size: 1.1rem; font-weight: 800;
    }
    .board-title .plane { font-size: 1.1rem; }
    .clock {
      font-size: 1.35rem; font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent-dim);
      letter-spacing: 0.02em;
    }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: none; border-bottom: none;
      padding: 14px 18px;
    }
    /* filter group: stacked label + control */
    .fg { display: flex; flex-direction: column; gap: 4px; }
    .fg .fl {
      font-size: 0.62rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.09em;
      white-space: nowrap;
    }
    .fg select, .fg input {
      height: 34px;
      background: var(--panel-2); color: var(--ink);
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 0 10px; font-size: 0.875rem; font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
      min-width: 0;
    }
    .fg input[type=search] { min-width: 170px; }
    .fg input::placeholder { color: var(--muted); opacity: 1; }
    .fg select:focus, .fg input:focus {
      outline: none; border-color: var(--accent); box-shadow: var(--ring);
    }
    /* toggle chip — styled checkbox */
    .toggle-chip {
      display: flex; align-items: center; gap: 7px;
      height: 34px; padding: 0 13px;
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: var(--radius-sm); cursor: pointer; user-select: none;
      font-size: 0.83rem; font-weight: 600; color: var(--muted);
      transition: border-color .15s, color .15s, background .15s;
    }
    .toggle-chip:hover { border-color: var(--accent); color: var(--ink); }
    .toggle-chip.is-on {
      background: var(--accent-glow); border-color: var(--accent); color: var(--ink);
    }
    /* Keyboard focus must be visible on the chip itself, since the real
       checkbox is visually hidden (not display:none — that drops it from the
       tab order and the a11y tree). */
    .toggle-chip:focus-within { border-color: var(--accent); box-shadow: var(--ring); }
    .toggle-chip input[type=checkbox] {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    .tc-box {
      width: 15px; height: 15px; border-radius: 4px; flex-shrink: 0;
      border: 1.5px solid currentColor;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; transition: background .15s, border-color .15s;
    }
    .toggle-chip.is-on .tc-box {
      background: var(--accent); border-color: var(--accent); color: var(--on-accent);
    }
    /* thin divider inside filter bar */
    .fb-sep { width: 1px; height: 34px; background: var(--line); flex-shrink: 0; }
    /* primary action button */
    .fb-btn {
      height: 34px; padding: 0 18px;
      background: var(--accent-2); color: #fff; border: none;
      border-radius: var(--radius-sm); font-size: 0.875rem; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: filter .15s, transform .05s; white-space: nowrap;
    }
    .fb-btn:hover { filter: brightness(1.1); }
    .fb-btn:active { transform: translateY(1px); }
    /* ghost link/button */
    .fb-link {
      height: 34px; padding: 0 13px;
      display: inline-flex; align-items: center;
      text-decoration: none; font-size: 0.8rem; font-weight: 600;
      color: var(--muted); border: 1px solid var(--line);
      border-radius: var(--radius-sm); white-space: nowrap;
      transition: color .15s, border-color .15s;
    }
    .fb-link:hover { color: var(--accent-dim); border-color: var(--accent); }
    .fb-link.hi { color: var(--accent-dim); }
    .fb-link.hi:hover { color: var(--ink); }
    /* segmented toggle (arrivals / departures) */
    .seg { display: flex; gap: 0; }
    .seg a {
      display: flex; align-items: center;
      height: 34px; padding: 0 14px;
      text-decoration: none; font-size: 0.8rem; font-weight: 600;
      color: var(--muted); background: var(--panel-2);
      border: 1px solid var(--line);
      transition: color .15s, background .15s, border-color .15s;
    }
    .seg a:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
    .seg a:last-child  { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; border-left: none; }
    .seg a:hover { color: var(--ink); border-color: var(--muted); }
    .seg a.on { background: var(--accent-2); color: #fff; border-color: var(--accent-2); z-index: 1; }
    .spacer { flex: 1; }
    .route-link {
      color: var(--accent-dim); text-decoration: none;
      font-size: 0.83rem; font-weight: 600;
      transition: color .15s;
    }
    .route-link:hover { color: var(--ink); }

    /* ── FIDS table ── */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);
    }
    table.fids {
      width: 100%; border-collapse: collapse;
      background: var(--panel);
      font-size: 0.9rem;
    }
    table.fids th {
      text-align: left; padding: 10px 16px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--accent);
      color: var(--accent-dim);
      font-size: 0.7rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      white-space: nowrap;
    }
    table.fids th span { display: block; color: var(--muted); font-size: 0.65rem; text-transform: none; letter-spacing: 0; }
    table.fids td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line-soft);
      vertical-align: middle; white-space: nowrap;
    }
    table.fids tbody tr { transition: background .1s; }
    table.fids tbody tr:hover { background: var(--accent-glow); }
    table.fids tbody tr:last-child td { border-bottom: 0; }

    .sta { font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .eta { font-size: 1rem; font-weight: 700; color: var(--yellow); font-variant-numeric: tabular-nums; }
    .from-city { font-weight: 700; }
    .sub { display: block; color: var(--muted); font-size: 0.75rem; }
    .airline {
      display: inline-block; vertical-align: middle; min-width: 30px; text-align: center;
      padding: 2px 7px; border-radius: 5px;
      color: #fff; font-weight: 800; font-size: 0.78rem; margin-right: 8px;
    }
    .airline-name { color: var(--muted); font-size: 0.82rem; }
    .flight a {
      color: var(--ink); font-weight: 700;
      font-variant-numeric: tabular-nums; text-decoration: none;
      transition: color .15s;
    }
    .flight a:hover { color: var(--accent-dim); text-decoration: underline; }

    /* Status remarks render as colour-coded pills (FIDS-style). */
    .remark {
      display: inline-block; vertical-align: middle;
      padding: 3px 11px; border-radius: 999px;
      font-weight: 700; font-size: 0.76rem; white-space: nowrap;
    }
    .remark.landed    { color: var(--green);  background: rgba(52,211,153,.13); }
    .remark.departed  { color: var(--muted);  background: rgba(147,161,160,.13); }
    .remark.ontime    { color: var(--ink);    background: rgba(231,236,235,.08); }
    .remark.estimated { color: var(--yellow); background: rgba(251,191,36,.13); }
    .remark.delayed   { color: var(--orange); background: rgba(251,146,60,.14); }
    .remark.boarding  { color: var(--cyan);   background: rgba(56,189,248,.14); }

    .empty, .error {
      padding: 32px; text-align: center; color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line); border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .error { color: var(--orange); }
    /* Friendly empty-state bits (icon + emphasis + hint) */
    .empty .empty-ico { font-size: 2rem; line-height: 1; margin-bottom: 8px; }
    .empty strong { color: var(--ink); font-weight: 700; }
    .empty .empty-hint { display: inline-block; margin-top: 6px; color: var(--muted); font-size: 0.85rem; }

    .count { margin: 0 0 12px; font-weight: 700; color: var(--muted); font-size: 0.85rem; }

    .badge {
      display: inline-block; vertical-align: middle; padding: 2px 9px; border-radius: 999px;
      font-size: 0.7rem; font-weight: 700;
    }
    .badge.direct { background: rgba(52,211,153,.14); color: var(--green); }
    .badge.stops  { background: rgba(251,146,60,.14); color: var(--orange); }

    /* ── Generic page bits ── */
    h1 { font-size: 1.3rem; margin: 0 0 18px; letter-spacing: -0.01em; }
    .back {
      display: inline-flex; align-items: center; gap: 5px;
      margin-bottom: 14px;
      color: var(--accent-dim); text-decoration: none;
      font-size: 0.875rem; font-weight: 600;
      transition: color .15s;
    }
    .back:hover { color: var(--ink); }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 22px;
      box-shadow: var(--shadow);
    }
    form.search {
      display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 18px; margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    form.search label {
      display: flex; flex-direction: column; gap: 5px;
      font-size: 0.72rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    form.search select, form.search input {
      background: var(--panel-2); color: var(--ink);
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 8px 11px; font-size: 0.875rem; font-family: inherit;
      min-width: 200px;
      transition: border-color .15s, box-shadow .15s;
    }
    form.search input::placeholder { color: var(--muted); opacity: 1; }
    form.search select:focus, form.search input:focus {
      outline: none; border-color: var(--accent); box-shadow: var(--ring);
    }
    form.search button {
      background: var(--accent-2); color: #fff; border: none;
      border-radius: var(--radius-sm); padding: 9px 22px;
      font-size: 0.875rem; font-weight: 700; font-family: inherit; cursor: pointer;
      transition: filter .15s, transform .05s;
    }
    form.search button:hover { filter: brightness(1.1); }
    form.search button:active { transform: translateY(1px); }

    .detail-route .code { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.01em; }
    .detail-grid {
      display: grid; gap: 12px;
      grid-template-columns: repeat(3, 1fr);
    }
    .detail-grid > div {
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: var(--radius-sm); padding: 12px 14px;
    }
    .detail-grid .span-full { grid-column: 1 / -1; }
    .detail-grid .label { font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
    .detail-grid .value { font-size: 1rem; font-weight: 700; margin-top: 3px; }
    .detail-grid .value.mono { font-family: "Menlo","Consolas","SF Mono",monospace; font-size: 0.85rem; word-break: break-all; }
    .detail-route {
      display: flex; align-items: center; gap: 0; margin: 8px 0 22px;
    }
    .detail-route .route-end { flex: 1; }
    .detail-route .route-end.right { text-align: right; }
    .route-mid {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 0 18px; color: var(--muted);
    }
    .route-mid .arrow { color: var(--accent-dim); font-size: 1.1rem; }
    .route-mid .dur { font-size: 0.75rem; font-weight: 600; white-space: nowrap; }

    /* ── Hotel card grid ── */
    .hotel-grid {
      display: grid; gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      background: var(--panel);
      border: 1px solid var(--line); border-top: none;
      padding: 16px;
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .hotel-card {
      display: flex; flex-direction: column;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform .16s, border-color .16s, box-shadow .16s;
    }
    .hotel-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }
    .hotel-card .photo { position: relative; aspect-ratio: 3/2; background: var(--photo-bg); overflow: hidden; }
    .hotel-card .photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
    .hotel-card:hover .photo img { transform: scale(1.05); }
    .hotel-card .stars {
      position: absolute; top: 8px; left: 8px;
      background: rgba(8,9,11,.75); backdrop-filter: blur(3px);
      border-radius: 5px; padding: 2px 8px;
      font-size: 0.75rem; color: var(--yellow); letter-spacing: 0.04em;
    }
    .hotel-card .rating-badge {
      position: absolute; top: 8px; right: 8px;
      background: var(--accent); color: var(--on-accent);
      border-radius: 999px; padding: 2px 10px;
      font-size: 0.8rem; font-weight: 800; font-variant-numeric: tabular-nums;
    }
    .hotel-card .body { display: flex; flex-direction: column; gap: 9px; padding: 13px 14px 14px; flex: 1; }
    .hotel-card .name { font-weight: 800; font-size: 0.95rem; line-height: 1.3; }
    .hotel-card .loc { color: var(--muted); font-size: 0.78rem; }
    .hotel-card .loc .city { color: var(--accent-dim); font-weight: 700; }
    .amenities { display: flex; flex-wrap: wrap; gap: 5px; }
    .amenities .chip {
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 999px; padding: 2px 9px;
      font-size: 0.68rem; color: var(--muted); white-space: nowrap;
    }
    .hotel-card .foot {
      margin-top: auto;
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 8px; padding-top: 10px; border-top: 1px solid var(--line-soft);
    }
    .hotel-card .price { font-size: 1.1rem; font-weight: 800; }
    .hotel-card .price span { font-size: 0.72rem; color: var(--muted); font-weight: 500; }
    .hotel-card .reviews { font-size: 0.72rem; color: var(--muted); text-align: right; }

    /* ── Booking ledger ── */
    .type-badge {
      display: inline-block; vertical-align: middle; min-width: 48px; text-align: center;
      padding: 3px 8px; border-radius: 5px;
      color: #fff; font-weight: 700; font-size: 0.68rem; letter-spacing: 0.05em;
    }
    .type-badge.flight { background: var(--accent-2); }
    .type-badge.hotel  { background: var(--hotel); }
    .status-pill {
      display: inline-block; vertical-align: middle; padding: 3px 11px; border-radius: 999px;
      font-size: 0.73rem; font-weight: 700;
      background: rgba(52,211,153,.13); color: var(--green);  /* default: confirmed */
      text-transform: capitalize;
    }
    .status-pill.st-cancelled { background: rgba(248,113,113,.14); color: var(--red); }
    .status-pill.st-pending   { background: rgba(251,191,36,.14); color: var(--yellow); }
    .ref { font-variant-numeric: tabular-nums; font-size: 0.84rem; }
    table.fids.ledger td, table.fids.ledger th { white-space: normal; }
    table.fids.ledger .ref, table.fids.ledger .sta { white-space: nowrap; }

    /* ── "Explore {city}" cross-link strip ── */
    .explore {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      margin-top: 16px; padding: 12px 16px;
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
      font-size: 0.85rem;
    }
    .explore-lbl { font-weight: 700; color: var(--muted); margin-right: 2px; }
    .explore a {
      display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
      padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line);
      color: var(--ink); font-weight: 600;
      transition: border-color .15s, background .15s, color .15s;
    }
    .explore a:hover { border-color: var(--accent); background: var(--accent-glow); }
    .explore a[aria-current] { color: var(--muted); border-style: dashed; pointer-events: none; }

    footer {
      max-width: 1140px; margin: 0 auto;
      padding: 18px 20px 0; color: var(--muted); font-size: 0.78rem;
      border-top: 1px solid var(--line);
    }
    footer a { color: var(--accent-dim); }
    footer a:hover { color: var(--ink); }

    /* ═══════════════════════════════════════════
       RESPONSIVE
       Breakpoints: 900 (tablet)  640 (mobile)  400 (small mobile)
    ═══════════════════════════════════════════ */

    /* ── Tablet ≤ 900px ── */
    @media (max-width: 900px) {
      .detail-grid { grid-template-columns: repeat(2, 1fr); }
      .hotel-grid  { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    }

    /* ── Mobile ≤ 640px ── */
    @media (max-width: 640px) {
      /* Page chrome */
      .wrap { padding: 14px 12px 52px; }

      /* ── Topbar: horizontal scroll so all tabs stay reachable ── */
      .topbar {
        padding: 0 10px;
        overflow-x: auto; overflow-y: hidden;
        scrollbar-width: none;          /* Firefox */
        -webkit-overflow-scrolling: touch;
      }
      .topbar::-webkit-scrollbar { display: none; }
      .topbar-brand {
        padding-right: 14px;
        font-size: 0.82rem;
        flex-shrink: 0;
      }
      .tab { padding: 9px 10px; font-size: 0.78rem; flex-shrink: 0; }
      /* underline indicator gets lost on scroll; replace with bg highlight */
      .tab.on::after { display: none; }
      .tab.on { background: var(--panel-2); }

      /* ── Board head ── */
      .board-head { padding: 11px 14px; gap: 8px; flex-wrap: wrap; }
      .board-title { font-size: 0.92rem; }
      .clock { font-size: 1rem; }

      /* ── Filter bar ── */
      .filter-bar { padding: 12px 14px; gap: 8px; }
      /* Every filter group fills available space; 2 per row on most phones */
      .fg { flex: 1 1 130px; }
      .fg select, .fg input { width: 100%; }
      /* Comfortable touch targets on mobile (≈40px) */
      .fg select, .fg input, .fb-btn, .fb-link, .toggle-chip, .seg a { height: 40px; }
      /* Hide decorative separators — layout speaks for itself */
      .fb-sep { display: none; }
      /* Stretch action buttons to match control height */
      .fb-btn { flex: 0 0 auto; }
      .fb-link { flex: 0 0 auto; }
      /* Segmented control wraps but stays intact */
      .seg { flex-shrink: 0; }
      .seg a { padding: 0 11px; font-size: 0.77rem; }
      /* Hide "spacer" on mobile so Clear/nav links don't float far away */
      .filter-bar .spacer { display: none; }

      /* ── FIDS table ── */
      table.fids { font-size: 0.8rem; }
      table.fids th, table.fids td { padding: 9px 10px; }

      /* ── Flight detail ── */
      .detail-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .detail-route .code { font-size: 1.3rem; }
      .route-mid { padding: 0 10px; }

      /* ── Search form (route search page) ── */
      form.search { padding: 14px; gap: 10px; }
      form.search label { flex: 1 1 140px; }
      form.search select,
      form.search input  { min-width: 0; width: 100%; }

      /* ── Cards ── */
      .hotel-grid { padding: 12px; gap: 12px; }
      .hotel-grid { grid-template-columns: 1fr; }

      /* ── Generic ── */
      h1 { font-size: 1.1rem; }
      footer { font-size: 0.73rem; padding: 14px 12px 0; }
    }

    /* ── Small mobile ≤ 400px ── */
    @media (max-width: 400px) {
      /* Brand: keep icon, drop text to save 80px of nav space */
      .topbar-brand .brand-label { display: none; }
      /* 1 col only */
      .fg { flex: 1 1 100%; }
      .detail-grid { grid-template-columns: 1fr 1fr; }
    }

    /* ── Page-load progress bar ──
       A premium top loading bar shown while a page (or its assets) loads and
       while navigating between pages. Driven by translateX — never scaleX —
       so the gradient, comet glow, and sheen don't distort as it fills.
       Progress is set inline as translateX(-(100 - pct)%): 0% hidden, 100%
       full. The JS owns the timing; CSS owns the look. */
    #nav-progress {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 3px;
      z-index: var(--z-progress);
      pointer-events: none;
      opacity: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg,
        var(--accent-2) 0%, var(--accent) 58%, var(--accent-dim) 100%);
      will-change: transform, opacity;
      transition: transform .4s cubic-bezier(.22,1,.36,1), opacity .25s ease;
    }
    /* Glowing comet head riding the leading edge of the fill. */
    #nav-progress::after {
      content: '';
      position: absolute; top: 0; right: 0; height: 100%; width: 96px;
      background: linear-gradient(90deg, transparent, var(--accent-dim));
      box-shadow: 0 0 10px 2px var(--accent), 0 0 16px 3px var(--accent-glow);
      border-radius: 0 3px 3px 0;
    }
    /* While waiting, the comet head pulses — a soft "still working" heartbeat.
       Opacity-only so it stays cheap and never bleeds past the leading edge. */
    #nav-progress.is-busy::after {
      animation: np-pulse 1.3s cubic-bezier(.4,0,.6,1) infinite;
    }
    @keyframes np-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: .55; }
    }

    /* ── Cross-document view transitions (progressive enhancement) ──
       Native, JS-free crossfade between dashboard pages where supported
       (Chromium-based browsers). Everywhere else, navigation is unaffected. */
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: vt-out .16s cubic-bezier(.4,0,1,1) both; }
    ::view-transition-new(root) { animation: vt-in  .26s cubic-bezier(.16,1,.3,1) both; }
    @keyframes vt-out { to { opacity: 0; } }
    @keyframes vt-in  {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Reduced motion ──
       Honor prefers-reduced-motion: near-instant transitions, no hover lift,
       no scaling images, and hide the animated nav progress bar. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
      #nav-progress { display: none; }
      ::view-transition-old(root),
      ::view-transition-new(root) { animation: none !important; }
      .hotel-card:hover { transform: none; }
      .hotel-card:hover .photo img { transform: none; }
      .fb-btn:active, form.search button:active { transform: none; }
    }
  </style>
  <script>
    /* Apply saved theme before paint to avoid a flash (Sunset is the default). */
    (function () {
      try {
        if (localStorage.getItem('tp-theme') === 'nightfall')
          document.documentElement.dataset.theme = 'nightfall';
      } catch (e) {}
    })();
  </script>
  <script>
    /* ── TripStore: client-side travel checklists (localStorage) ──
       State: { trips: [{id,name,items:[{key,name,catKey,category,city,country,image,code,done}]}],
                currentTripId }. Items keyed by place code/name (deduped per trip).
       Emits a 'tripschange' event on every mutation so the UI can refresh. */
    window.TripStore = (function () {
      var KEY = 'tp-trips';
      function read() {
        try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
      }
      function write(s) {
        try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
        window.dispatchEvent(new CustomEvent('tripschange'));
      }
      function uid() { return 't' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }
      function state() {
        var s = read();
        if (!Array.isArray(s.trips)) s.trips = [];
        return s;
      }
      var API = {
        trips: function () { return state().trips; },
        current: function () {
          var s = state();
          return s.trips.find(function (t) { return t.id === s.currentTripId; }) || s.trips[0] || null;
        },
        setCurrent: function (id) { var s = state(); s.currentTripId = id; write(s); },
        create: function (name) {
          var s = state();
          var t = { id: uid(), name: (name || 'My trip').trim() || 'My trip', items: [] };
          s.trips.push(t); s.currentTripId = t.id; write(s); return t;
        },
        rename: function (id, name) {
          var s = state(); var t = s.trips.find(function (x) { return x.id === id; });
          if (t) { t.name = (name || t.name).trim() || t.name; write(s); }
        },
        remove: function (id) {
          var s = state(); s.trips = s.trips.filter(function (t) { return t.id !== id; });
          if (s.currentTripId === id) s.currentTripId = s.trips[0] ? s.trips[0].id : null;
          write(s);
        },
        /* Ensure there's a current trip (auto-create the first one). */
        ensureCurrent: function () {
          var c = this.current();
          if (c) return c;
          return this.create('My trip');
        },
        has: function (tripId, key) {
          var t = state().trips.find(function (x) { return x.id === tripId; });
          return !!(t && t.items.some(function (i) { return i.key === key; }));
        },
        add: function (tripId, item) {
          var s = state(); var t = s.trips.find(function (x) { return x.id === tripId; });
          if (!t || t.items.some(function (i) { return i.key === item.key; })) return;
          t.items.push(Object.assign({ done: false }, item)); write(s);
        },
        removeItem: function (tripId, key) {
          var s = state(); var t = s.trips.find(function (x) { return x.id === tripId; });
          if (t) { t.items = t.items.filter(function (i) { return i.key !== key; }); write(s); }
        },
        toggleDone: function (tripId, key) {
          var s = state(); var t = s.trips.find(function (x) { return x.id === tripId; });
          if (!t) return;
          var i = t.items.find(function (x) { return x.key === key; });
          if (i) { i.done = !i.done; write(s); }
        },
        /* total items across all trips — for the nav badge */
        totalItems: function () {
          return state().trips.reduce(function (n, t) { return n + t.items.length; }, 0);
        }
      };
      return API;
    })();

    /* ── Themed prompt/confirm: returns a Promise (string|null for prompt,
       bool for confirm). Replaces the ugly native dialogs. ── */
    window.tpDialog = function (opts) {
      opts = opts || {};
      var hasInput = opts.input !== false;
      return new Promise(function (resolve) {
        var el = document.getElementById('tp-dialog');
        var titleEl = document.getElementById('tp-dialog-title');
        var msgEl = document.getElementById('tp-dialog-msg');
        var input = document.getElementById('tp-dialog-input');
        var ok = document.getElementById('tp-dialog-ok');
        titleEl.textContent = opts.title || '';
        msgEl.textContent = opts.message || '';
        msgEl.style.display = opts.message ? '' : 'none';
        input.style.display = hasInput ? '' : 'none';
        input.value = opts.value || '';
        ok.textContent = opts.okLabel || 'OK';
        ok.classList.toggle('danger', !!opts.danger);
        el.classList.add('show'); el.setAttribute('aria-hidden', 'false');
        if (hasInput) { input.focus(); input.select(); } else { ok.focus(); }

        function cleanup() {
          ok.removeEventListener('click', onOk);
          el.querySelectorAll('[data-tp-cancel]').forEach(function (b) { b.removeEventListener('click', onCancel); });
          document.removeEventListener('keydown', onKey, true);
        }
        function done(val) { el.classList.remove('show'); el.setAttribute('aria-hidden', 'true'); cleanup(); resolve(val); }
        function onOk() { done(hasInput ? input.value.trim() : true); }
        function onCancel() { done(hasInput ? null : false); }
        function onKey(e) {
          if (e.key === 'Escape') { e.preventDefault(); onCancel(); }
          else if (e.key === 'Enter') { e.preventDefault(); onOk(); }
        }
        ok.addEventListener('click', onOk);
        el.querySelectorAll('[data-tp-cancel]').forEach(function (b) { b.addEventListener('click', onCancel); });
        document.addEventListener('keydown', onKey, true);
      });
    };
    window.tpPrompt = function (title, value) { return window.tpDialog({ title: title, value: value, input: true }); };
    window.tpConfirm = function (title, message, okLabel) { return window.tpDialog({ title: title, message: message, input: false, okLabel: okLabel || 'OK', danger: true }); };
  </script>
</head>
<body>
  <div id="nav-progress" aria-hidden="true"></div>
  <nav class="topbar">
    <a class="topbar-brand" href="/dashboard">
      <span class="icon">✈</span><span class="brand-label">Travel Mock</span>
    </a>
    {% set path = request.url.path %}
    <div class="tabs">
      <a href="/dashboard/flights" class="tab {{ 'on' if path.startswith('/dashboard/flights') else '' }}">Flights</a>
      <a href="/dashboard/hotels"  class="tab {{ 'on' if path.startswith('/dashboard/hotels')  else '' }}">Hotels</a>
      <a href="/dashboard/places"  class="tab {{ 'on' if path.startswith('/dashboard/places')  else '' }}">Places</a>
      <a href="/dashboard/tips"    class="tab {{ 'on' if path.startswith('/dashboard/tips')    else '' }}">Local Tips</a>
      <a href="/dashboard/visa"    class="tab {{ 'on' if path.startswith('/dashboard/visa')    else '' }}">Visa</a>
      <a href="/dashboard/weather" class="tab {{ 'on' if path.startswith('/dashboard/weather') else '' }}">Weather</a>
      <a href="/dashboard/air-quality" class="tab {{ 'on' if path.startswith('/dashboard/air-quality') else '' }}">Air Quality</a>
      <a href="/dashboard/bookings"class="tab {{ 'on' if path.startswith('/dashboard/bookings')else '' }}">Bookings</a>
      <a href="/dashboard/checklist" class="tab {{ 'on' if path.startswith('/dashboard/checklist') else '' }}">My List<span id="trip-badge" class="tab-badge" hidden></span></a>
      <a href="/dashboard/agent-config" class="tab {{ 'on' if path.startswith('/dashboard/agent-config') else '' }}">Agent Config</a>
      <a href="/dashboard/prompts" class="tab {{ 'on' if path.startswith('/dashboard/prompts') else '' }}">Prompts</a>
      <span class="spacer"></span>
      <button type="button" id="palette-btn" class="theme-btn" title="Search & jump (⌘K)" aria-label="Open command palette">
        <span aria-hidden="true">⌘</span><span class="theme-name">K</span>
      </button>
      <button type="button" id="theme-btn" class="theme-btn" title="Switch theme" aria-label="Switch theme">
        <span class="theme-dot" aria-hidden="true"></span><span class="theme-name">Sunset</span>
      </button>
      <a href="/docs" class="tab tab-ext">API Docs ↗</a>
    </div>
  </nav>
  <div class="wrap {% block wrap_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </div>
  <footer>
    Mock data · flights are generated, bookings stored locally ·
    <a href="/docs">API docs</a>
  </footer>

  <!-- Command palette -->
  <div id="cmdk" class="cmdk" aria-hidden="true">
    <div class="cmdk-backdrop" data-cmdk-close></div>
    <div class="cmdk-panel" role="dialog" aria-modal="true" aria-label="Search and jump">
      <input id="cmdk-input" class="cmdk-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Jump to a page, city, or airport…" aria-label="Search">
      <div id="cmdk-list" class="cmdk-list" role="listbox"></div>
      <div class="cmdk-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> open</span>
        <span><kbd>esc</kbd> close</span>
      </div>
    </div>
  </div>

  <!-- Themed prompt/confirm dialog -->
  <div id="tp-dialog" class="tp-dialog" aria-hidden="true">
    <div class="tp-dialog-back" data-tp-cancel></div>
    <div class="tp-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="tp-dialog-title">
      <h2 class="tp-dialog-title" id="tp-dialog-title"></h2>
      <p class="tp-dialog-msg" id="tp-dialog-msg"></p>
      <input class="tp-dialog-input" id="tp-dialog-input" type="text" autocomplete="off" spellcheck="false">
      <div class="tp-dialog-actions">
        <button class="tp-btn tp-btn-cancel" type="button" data-tp-cancel>Cancel</button>
        <button class="tp-btn tp-btn-ok" type="button" id="tp-dialog-ok">OK</button>
      </div>
    </div>
  </div>

  <script>
    /* ── Theme switch (Sunset ⇄ Nightfall) ── */
    (function () {
      var btn = document.getElementById('theme-btn');
      if (!btn) return;
      var name = btn.querySelector('.theme-name');
      function label() {
        name.textContent = document.documentElement.dataset.theme === 'nightfall' ? 'Nightfall' : 'Sunset';
      }
      label();
      btn.addEventListener('click', function () {
        var next = document.documentElement.dataset.theme === 'nightfall' ? 'sunset' : 'nightfall';
        if (next === 'sunset') delete document.documentElement.dataset.theme;
        else document.documentElement.dataset.theme = 'nightfall';
        try { localStorage.setItem('tp-theme', next); } catch (e) {}
        label();
      });
    })();

    /* ── Command palette (⌘K) ── */
    (function () {
      var modal = document.getElementById('cmdk');
      var input = document.getElementById('cmdk-input');
      var list = document.getElementById('cmdk-list');
      if (!modal) return;
      var enc = encodeURIComponent;
      var PAGES = [
        { ic: '🛫', lbl: 'Flights', sub: 'Arrivals & departures board', url: '/dashboard/flights', kw: 'flights board fids' },
        { ic: '🧭', lbl: 'Search flights by route', sub: '', url: '/dashboard/flights/search', kw: 'route search' },
        { ic: '🏨', lbl: 'Hotels', sub: '', url: '/dashboard/hotels', kw: 'hotels stay' },
        { ic: '🗺️', lbl: 'Places', sub: 'Attractions & things to do', url: '/dashboard/places', kw: 'places attractions' },
        { ic: '💡', lbl: 'Local Tips', sub: '', url: '/dashboard/tips', kw: 'tips advice' },
        { ic: '🛂', lbl: 'Visa & Entry', sub: 'Visa-free, VoA & e-visa guidance', url: '/dashboard/visa', kw: 'visa entry passport requirements immigration' },
        { ic: '🌦️', lbl: 'Weather', sub: '', url: '/dashboard/weather', kw: 'weather forecast' },
        { ic: '🌫️', lbl: 'Air Quality', sub: 'US-AQI & pollutants', url: '/dashboard/air-quality', kw: 'air quality aqi pollution haze smog pm2.5' },
        { ic: '🎫', lbl: 'Bookings', sub: '', url: '/dashboard/bookings', kw: 'bookings reservations' },
        { ic: '📝', lbl: 'Prompts', sub: '', url: '/dashboard/prompts', kw: 'prompts versions' },
        { ic: '📚', lbl: 'API Docs', sub: '', url: '/docs', kw: 'api docs swagger' }
      ];
      var dynamic = null;      // built after fetch: city actions + airports
      var items = [], active = 0;

      function build(data) {
        var out = [];
        (data.cities || []).forEach(function (c) {
          var kw = (c.name + ' ' + (c.country || '')).toLowerCase();
          out.push({ ic: '🌦️', lbl: 'Weather', sub: c.name, url: '/dashboard/weather?city=' + enc(c.name), kw: kw, grp: c.name });
          out.push({ ic: '🌫️', lbl: 'Air Quality', sub: c.name, url: '/dashboard/air-quality?city=' + enc(c.name), kw: kw, grp: c.name });
          out.push({ ic: '🏨', lbl: 'Hotels', sub: c.name, url: '/dashboard/hotels?city=' + enc(c.name), kw: kw, grp: c.name });
          out.push({ ic: '🗺️', lbl: 'Places', sub: c.name, url: '/dashboard/places?city=' + enc(c.name), kw: kw, grp: c.name });
          out.push({ ic: '💡', lbl: 'Tips', sub: c.name, url: '/dashboard/tips?city=' + enc(c.name), kw: kw, grp: c.name });
          out.push({ ic: '🛂', lbl: 'Visa', sub: c.name, url: '/dashboard/visa?city=' + enc(c.name), kw: kw, grp: c.name });
        });
        (data.airports || []).forEach(function (a) {
          out.push({ ic: '🛫', lbl: a.code + ' — ' + a.city, sub: 'Flight board', url: '/dashboard/flights?airport=' + enc(a.code), kw: (a.code + ' ' + a.city).toLowerCase(), grp: 'Airports' });
        });
        return out;
      }

      function render(q) {
        q = q.trim().toLowerCase();
        var rows = [];
        // Pages: always; filter by query if present.
        PAGES.forEach(function (p) {
          if (!q || (p.lbl + ' ' + p.kw).toLowerCase().indexOf(q) !== -1) rows.push(Object.assign({ grp: 'Pages' }, p));
        });
        // Dynamic (cities/airports): only when there's a query.
        if (q && dynamic) {
          dynamic.forEach(function (d) { if (d.kw.indexOf(q) !== -1) rows.push(d); });
        }
        rows = rows.slice(0, 24);
        items = rows;
        active = 0;
        if (!rows.length) { list.innerHTML = '<div class="cmdk-empty">No matches.</div>'; return; }
        var html = '', lastGrp = null;
        rows.forEach(function (r, i) {
          if (r.grp !== lastGrp) { html += '<div class="cmdk-group">' + r.grp + '</div>'; lastGrp = r.grp; }
          html += '<a class="cmdk-item' + (i === 0 ? ' active' : '') + '" role="option" data-i="' + i + '" href="' + r.url + '">' +
                  '<span class="ic">' + r.ic + '</span><span class="lbl">' + r.lbl +
                  (r.sub ? '<span class="sub">' + r.sub + '</span>' : '') + '</span></a>';
        });
        list.innerHTML = html;
      }

      function setActive(i) {
        var els = list.querySelectorAll('.cmdk-item');
        if (!els.length) return;
        active = (i + els.length) % els.length;
        els.forEach(function (e, k) { e.classList.toggle('active', k === active); });
        els[active].scrollIntoView({ block: 'nearest' });
      }

      function open() {
        modal.classList.add('show');
        modal.setAttribute('aria-hidden', 'false');
        input.value = ''; render('');
        input.focus();
        if (!dynamic) {
          fetch('/dashboard/_search.json').then(function (r) { return r.json(); })
            .then(function (d) { dynamic = build(d); }).catch(function () { dynamic = []; });
        }
      }
      function close() { modal.classList.remove('show'); modal.setAttribute('aria-hidden', 'true'); }

      var trigger = document.getElementById('palette-btn');
      if (trigger) trigger.addEventListener('click', open);

      document.addEventListener('keydown', function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); modal.classList.contains('show') ? close() : open(); return; }
        if (!modal.classList.contains('show')) return;
        if (e.key === 'Escape') { close(); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
        else if (e.key === 'Enter') { e.preventDefault(); if (items[active]) location.href = items[active].url; }
      });
      input.addEventListener('input', function () { render(input.value); });
      modal.querySelectorAll('[data-cmdk-close]').forEach(function (el) { el.addEventListener('click', close); });
    })();

    /* ── Nav badge: total saved items across trips ── */
    (function () {
      var badge = document.getElementById('trip-badge');
      if (!badge || !window.TripStore) return;
      function refresh() {
        var n = TripStore.totalItems();
        badge.textContent = n;
        badge.hidden = n === 0;
      }
      refresh();
      window.addEventListener('tripschange', refresh);
      window.addEventListener('storage', refresh);  // sync across tabs
    })();
  </script>
  <script>
    (function () {
      var bar = document.getElementById('nav-progress');
      if (!bar) return;

      // Respect reduced-motion: skip the animated bar entirely.
      var reduce = window.matchMedia
        && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var pct = 0;          // current fill, 0–100
      var active = false;   // is a load in flight?
      var trickle = null;   // creep interval
      var fade1 = null, fade2 = null;

      function set(p) {
        pct = p < 0 ? 0 : p > 100 ? 100 : p;
        bar.style.transform = 'translateX(-' + (100 - pct) + '%)';
      }

      function clearAll() {
        clearInterval(trickle); trickle = null;
        clearTimeout(fade1); clearTimeout(fade2);
      }

      // Begin (or restart) the loading indicator: snap to a starting chunk,
      // then creep toward ~90% — slower the closer it gets, never finishing
      // on its own (done() owns the finish).
      function start() {
        if (reduce || active) return;
        active = true;
        clearAll();
        bar.classList.add('is-busy');
        bar.style.transition = 'none';
        set(0);
        bar.style.opacity = '1';
        // Next frame: re-enable easing and jump in, so the snap-to-0 doesn't
        // animate but the climb does.
        requestAnimationFrame(function () {
          bar.style.transition = '';
          set(18 + Math.random() * 12);
          trickle = setInterval(function () {
            var remaining = 90 - pct;
            if (remaining < 0.4) return;
            set(pct + Math.max(0.4, remaining * 0.08));
          }, 360);
        });
      }

      // Finish: rush to 100%, then fade out and reset off-screen for next time.
      function done() {
        if (!active) return;
        active = false;
        clearAll();
        bar.classList.remove('is-busy');
        set(100);
        fade1 = setTimeout(function () {
          bar.style.opacity = '0';
          fade2 = setTimeout(function () {
            bar.style.transition = 'none';
            set(0);
            requestAnimationFrame(function () { bar.style.transition = ''; });
          }, 300);
        }, 200);
      }

      // ── Initial page load ──
      // If assets are still arriving when this runs, show the bar climbing and
      // complete it on window 'load'. Already-complete (cached/instant) pages
      // skip it — no gratuitous flash.
      if (!reduce && document.readyState !== 'complete') {
        start();
        window.addEventListener('load', done, { once: true });
      }

      // ── Navigation away ── start the bar; the next document replaces it.
      // Any same-origin internal link click.
      document.addEventListener('click', function (e) {
        var a = e.target.closest('a[href]');
        if (!a || a.target || a.getAttribute('href').charAt(0) === '#') return;
        if (a.hasAttribute('download') || /^(mailto|tel):/i.test(a.getAttribute('href'))) return;
        try { if (new URL(a.href).origin !== location.origin) return; } catch (_) { return; }
        start();
      });

      // Filter / search form submissions (all are GET, same origin).
      document.addEventListener('submit', start);

      // Back/forward cache re-use: cancel any in-flight bar so it isn't stuck.
      window.addEventListener('pageshow', function (e) {
        if (e.persisted) { clearAll(); active = false; bar.classList.remove('is-busy'); bar.style.transition = 'none'; set(0); bar.style.opacity = '0'; }
      });
    }());
  </script>
