<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Travel Planner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Standalone page: no sidebar/topbar for a logged-out visitor, so the
       colour tokens are copied from base.html instead of extending it. */
    :root {
      color-scheme: dark;
      --bg:       #1a1614;
      --panel:    #221d1a;
      --panel-2:  #2e2723;
      --line:     #3e342e;
      --accent:   #ff6f5e;
      --accent-2: #c2410c;
      --accent-dim: #ffa99c;
      --on-accent: #3a0f08;
      --ink:      #efe9e6;
      --muted:    #a89c96;
      --red:      #f87171;
      --radius:   12px;
      --radius-sm: 8px;
      --shadow-lg: 0 14px 32px -8px rgba(0,0,0,.60), 0 4px 10px -4px rgba(0,0,0,.40);
      --ring:     0 0 0 3px rgba(255,111,94,.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 360px; margin: 24px;
      padding: 28px 26px 24px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow-lg);
    }
    .brand {
      display: flex; align-items: center; gap: 9px; margin-bottom: 18px;
      font-size: 0.95rem; font-weight: 800; letter-spacing: -0.01em;
    }
    .brand .icon {
      display: flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 7px;
      background: var(--accent); color: var(--on-accent); font-size: 0.88rem;
    }
    h1 { margin: 0 0 4px; font-size: 1.15rem; }
    .hint { margin: 0 0 18px; color: var(--muted); font-size: 0.85rem; }
    label { display: block; margin-bottom: 12px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
    input {
      display: block; width: 100%; margin-top: 5px;
      height: 38px; padding: 0 11px;
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: var(--radius-sm); color: var(--ink);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
    }
    input:focus-visible { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
    .notice {
      margin: 0 0 14px; padding: 9px 11px;
      border-radius: var(--radius-sm); font-size: 0.82rem; font-weight: 600;
      border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
    }
    .notice.error { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
    .tab {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 38px; margin-top: 6px;
      border: 0; border-radius: var(--radius-sm); cursor: pointer;
      background: var(--accent); color: var(--on-accent);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 700;
      transition: background .15s;
    }
    .tab:hover { background: var(--accent-dim); }
    .tab:focus-visible { outline: none; box-shadow: var(--ring); }
    .tab:disabled { cursor: not-allowed; opacity: .5; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="icon" aria-hidden="true">✈️</span>Travel Planner</div>
    <h1>Dashboard login</h1>
    <p class="hint">Sign in with the operator credentials for this server.</p>
    {% if not configured %}
    <p class="notice" role="status">Dashboard login is not configured on this server</p>
    {% endif %}
    {% if error %}
    <p class="notice error" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
      <label for="username">Username
        <input id="username" name="username" type="text" required autocomplete="username" autofocus>
      </label>
      <label for="password">Password
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="tab"{% if not configured %} disabled{% endif %}>Log in</button>
    </form>
  </main>
</body>
</html>
